name: KS FoodOps CI Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  backend-checks:
    name: Backend Lint & Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ks_owner
          POSTGRES_PASSWORD: ks_password
          POSTGRES_DB: ks_foodops_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r apps/api/requirements.txt
          pip install -r apps/worker/requirements.txt
          pip install pytest-cov httpx pytest-asyncio
          
      - name: Setup Database Roles & Migrations
        env:
          PGPASSWORD: ks_password
          PYTHONPATH: .
          DATABASE_URL: postgresql+asyncpg://ks_owner:ks_password@localhost:5432/ks_foodops_test
          OWNER_DATABASE_URL: postgresql+asyncpg://ks_owner:ks_password@localhost:5432/ks_foodops_test
        run: |
          psql -h localhost -U ks_owner -d ks_foodops_test -c "DO \$\$ BEGIN IF NOT EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname = 'ksfoodops_app') THEN CREATE ROLE ksfoodops_app WITH LOGIN PASSWORD 'ks_password'; END IF; END \$\$;"
          alembic upgrade head

      - name: Run Tests
        env:
          ENVIRONMENT: test
          PYTHONPATH: .
          DATABASE_URL: postgresql+asyncpg://ks_owner:ks_password@localhost:5432/ks_foodops_test
          OWNER_DATABASE_URL: postgresql+asyncpg://ks_owner:ks_password@localhost:5432/ks_foodops_test
          POSTGRES_APP_USER: ksfoodops_app
          POSTGRES_OWNER_USER: ks_owner
          CELERY_BROKER_URL: redis://localhost:6379/0
          JWT_SECRET: test_secret_long_enough_32_bytes_min_for_jwt!
          JWT_ALGORITHM: HS256
        run: |
          pytest tests/ -v

  frontend-checks:
    name: Frontend Build & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install Dependencies
        working-directory: apps/web
        run: npm ci

      - name: Build Next.js
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: npm run build
