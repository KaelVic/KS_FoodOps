version: '3.8'

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_OWNER_USER}
      POSTGRES_PASSWORD: ${POSTGRES_OWNER_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_OWNER_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - data-net
    deploy:
      resources:
        limits:
          memory: 512M

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}
    networks:
      - broker-net
    deploy:
      resources:
        limits:
          memory: 256M

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=${ENVIRONMENT}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ALGORITHM=${JWT_ALGORITHM}
      - DATABASE_URL=${DATABASE_URL}
      - OWNER_DATABASE_URL=${OWNER_DATABASE_URL}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
    depends_on:
      redis:
        condition: service_started
    volumes:
      - ./apps/api:/app/apps/api
      - ./modules:/app/modules
      - ./packages:/app/packages
    networks:
      - data-net
      - broker-net
      - web-net
    deploy:
      resources:
        limits:
          memory: 1G

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      - ENVIRONMENT=${ENVIRONMENT}
      - DATABASE_URL=${DATABASE_URL}
      - OWNER_DATABASE_URL=${OWNER_DATABASE_URL}
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD}@redis:6379/0
    depends_on:
      redis:
        condition: service_started
    volumes:
      - ./apps/worker:/app/apps/worker
      - ./modules:/app/modules
      - ./packages:/app/packages
    networks:
      - data-net
      - broker-net
    deploy:
      resources:
        limits:
          memory: 1G

  beat:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      - ENVIRONMENT=${ENVIRONMENT}
      - DATABASE_URL=${DATABASE_URL}
      - OWNER_DATABASE_URL=${OWNER_DATABASE_URL}
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD}@redis:6379/0
    depends_on:
      redis:
        condition: service_started

    volumes:
      - ./apps/worker:/app/apps/worker
      - ./modules:/app/modules
      - ./packages:/app/packages
    networks:
      - data-net
      - broker-net
    command: celery -A apps.worker.worker beat -l info --pidfile=
    deploy:
      resources:
        limits:
          memory: 256M

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - API_URL=http://api:8000
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    networks:
      - web-net


volumes:
  postgres_data:

networks:
  data-net:
  broker-net:
  web-net:
